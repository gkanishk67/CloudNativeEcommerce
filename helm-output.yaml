# Source: cloudnativeecommerce/templates/cloudnativeecommerce.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: cloudnativeecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: "cloudnativeecommerceacr67.azurecr.io/cloudnativeecommerce-apigateway:latest"
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Source: cloudnativeecommerce/templates/cloudnativeecommerce.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityservice
  namespace: cloudnativeecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identityservice
  template:
    metadata:
      labels:
        app: identityservice
    spec:
      containers:
        - name: identityservice
          image: "cloudnativeecommerceacr67.azurecr.io/cloudnativeecommerce-identityservice:latest"
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: identityservice-config
            - secretRef:
                name: identityservice-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
