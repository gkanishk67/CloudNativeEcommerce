apiVersion: v1
kind: Secret

metadata:
  name: identityservice-secret
  namespace: cloudnativeecommerce

type: Opaque

stringData:
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"
  Jwt__Key: "THIS_IS_MY_SUPER_SECRET_KEY_12345"

---

apiVersion: v1
kind: ConfigMap

metadata:
  name: identityservice-config
  namespace: cloudnativeecommerce

data:
  Jwt__Issuer: "IdentityService"
  Jwt__Audience: "CloudNativeEcommerce"
  Serilog__SeqServerUrl: "http://seq:5341"

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: identityservice
  namespace: cloudnativeecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: identityservice

  template:
    metadata:
      labels:
        app: identityservice

    spec:
      containers:
      - name: identityservice

        # image: cloudnativeecommerce-identityservice:latest
        # imagePullPolicy: Never
        
        image: cloudnativeecommerceacr67.azurecr.io/cloudnativeecommerce-identityservice:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        envFrom:
        - configMapRef:
            name: identityservice-config

        - secretRef:
            name: identityservice-secret

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

---

apiVersion: v1
kind: Service

metadata:
  name: identityservice
  namespace: cloudnativeecommerce

spec:
  selector:
    app: identityservice

  ports:
  - port: 8080
    targetPort: 8080

  type: ClusterIP