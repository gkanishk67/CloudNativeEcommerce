apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudnativeecommerce

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: "orderservice"
        static_configs:
          - targets: ["orderservice:8080"]

      - job_name: "productservice"
        static_configs:
          - targets: ["productservice:8080"]

      - job_name: "identityservice"
        static_configs:
          - targets: ["identityservice:8080"]

      - job_name: "apigateway"
        static_configs:
          - targets: ["apigateway:8080"]